# -----------------------------------------------------------------------------
# Leaf Lite — continuous integration.
#
# Builds the real release artefacts on every push and pull request:
#
#   build         static verification, JVM unit tests, lint,
#                 assembleDebug + assembleRelease + bundleRelease,
#                 apkanalyzer/bundletool size report against the §14 budgets,
#                 artefact upload (APK, AAB, size report, R8 mapping)
#   smoke-test    instrumented smoke test on an API 23 emulator (the minSdk
#                 floor) — install, no-INTERNET assertion, document registry
#   release       on a v* tag: publish a GitHub Release with the APK, AAB,
#                 size report and R8 mapping attached
#
# The release build is signed with the Gradle debug keystore when no signing
# secrets are configured (see app/build.gradle.kts and DECISIONS.md); add a
# keystore.properties with repository secrets to ship production-signed bits.
# -----------------------------------------------------------------------------
name: Android CI

on:
  push:
    branches: [main, master, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Static project verification
        run: python3 tools/verify_project.py

      - name: Unit tests, lint, debug + release APK, AAB
        run: ./gradlew testReleaseUnitTest lintRelease assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Size report (apkanalyzer + bundletool)
        run: bash tools/size_report.sh

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/leaf-lite-1.0.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/leaf-lite-1.0.0-release.aab
          cp build/size/size-report.txt dist/size-report.txt
          cp app/build/outputs/mapping/release/mapping.txt dist/leaf-lite-1.0.0-mapping.txt
          cp app/build/outputs/apk/debug/app-debug.apk dist/leaf-lite-1.0.0-debug.apk
          (cd dist && sha256sum leaf-lite-1.0.0-release.apk leaf-lite-1.0.0-release.aab leaf-lite-1.0.0-debug.apk > SHA256SUMS.txt)

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: leaf-lite-release-apk
          path: dist/leaf-lite-1.0.0-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: leaf-lite-release-aab
          path: dist/leaf-lite-1.0.0-release.aab
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: leaf-lite-debug-apk
          path: dist/leaf-lite-1.0.0-debug.apk
          if-no-files-found: error

      - name: Upload size report and checksums
        uses: actions/upload-artifact@v7
        with:
          name: leaf-lite-size-report
          path: |
            dist/size-report.txt
            dist/SHA256SUMS.txt
            dist/leaf-lite-1.0.0-mapping.txt
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/size/
          if-no-files-found: ignore

  smoke-test:
    name: Instrumented smoke (API 23)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run androidTest on API 23 (minSdk floor)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/leaf-lite-1.0.0-release.apk \
            dist/leaf-lite-1.0.0-release.aab \
            dist/leaf-lite-1.0.0-debug.apk \
            dist/size-report.txt \
            dist/SHA256SUMS.txt \
            dist/leaf-lite-1.0.0-mapping.txt \
            --generate-notes --title "Leaf Lite $GITHUB_REF_NAME"
