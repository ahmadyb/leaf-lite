# --- JVM / Gradle -----------------------------------------------------------
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.enableJetifier=false

# R8 runs in full mode: the strongest (smallest) optimisation set.
android.enableR8.fullMode=true

# Lint: never fail a size-sensitive release build on lint, we run it manually.
android.lint.abortOnError=false
